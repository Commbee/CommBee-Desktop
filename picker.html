<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'sha256-BAD6VRXDo38ebU1Mg83gnGktd2sSu3pTBSTLCzKWuxU='"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share screen · CommBee</title><style>body{margin:24px;font:15px system-ui;background:#faf9f2;color:#26291f}h1{font-size:24px}#sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}button{font:inherit;cursor:pointer;border:1px solid #ddd8c4;border-radius:12px;padding:12px;background:white;text-align:left}button:hover,button:focus-visible{outline:3px solid #ffc21c}img{display:block;width:100%;border-radius:6px;margin-bottom:10px}#cancel{margin-bottom:20px;background:#ffe28a}</style></head><body><h1>Choose what to share</h1><p>Only the screen or window you select will be shared.</p><button id="cancel">Cancel</button><div id="sources"></div><script>document.querySelector('#cancel').onclick=()=>capturePicker.choose(null);capturePicker.onSources(sources=>{for(const source of sources){const button=document.createElement('button'),image=document.createElement('img'),label=document.createElement('span');image.src=source.image;image.alt='';label.textContent=source.name;button.append(image,label);button.onclick=()=>capturePicker.choose(source.id);document.querySelector('#sources').append(button);}});</script></body></html>
