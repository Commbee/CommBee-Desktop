name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to publish
        default: v0.1.0
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
            name: windows
          - os: macos-15-intel
            flags: --mac --x64 --arm64
            name: macos
          - os: ubuntu-latest
            flags: --linux --x64
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- ${{ matrix.flags }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "CommBee Desktop $RELEASE_TAG" --notes "CommBee desktop beta for Windows, macOS (Apple Silicon and Intel), and Linux. An internet connection is required. Windows/macOS builds are unsigned; macOS builds are not notarized. Download only from this official repository."
          gh release upload "$RELEASE_TAG" ./* --clobber
